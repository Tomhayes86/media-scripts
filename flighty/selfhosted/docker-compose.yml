services:
  flighty:
    build:
      # Build context is the flighty/ directory so the image includes both
      # selfhosted/ (server code) and frontend/ (the PWA it serves).
      context: ..
      dockerfile: selfhosted/Dockerfile
    container_name: flighty
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      # Copy .env.example → .env and fill in.
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - OPENSKY_USERNAME=${OPENSKY_USERNAME:-}
      - OPENSKY_PASSWORD=${OPENSKY_PASSWORD:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      - TZ=${TZ:-Europe/London}
      # Apple Wallet pass generation (optional — leave blank to disable)
      - PASS_TYPE_ID=${PASS_TYPE_ID:-}
      - TEAM_ID=${TEAM_ID:-}
      - ORG_NAME=${ORG_NAME:-Flighty}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/flights').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
