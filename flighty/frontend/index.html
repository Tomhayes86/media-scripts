<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Flighty-lite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Flights</h1>
    <div class="header-actions">
      <button id="push-btn" hidden>Enable alerts</button>
    </div>
  </header>

  <form id="add-form">
    <input id="flight-number" placeholder="Flight (e.g. BA286)" autocapitalize="characters" required />
    <input id="flight-date" type="date" required />
    <button type="submit">Add</button>
  </form>

  <ul id="flight-list"></ul>

  <dialog id="detail">
    <button class="close" data-close>×</button>
    <div id="detail-body"></div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="app.js" type="module"></script>
</body>
</html>
